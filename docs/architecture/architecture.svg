" text-anchor="middle">asks only for missing fields</text><rect x="555" y="250" width="490" height="80" rx="10" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="800.0" y="276" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Rules engine</text><text x="800.0" y="296" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">eligibility (tier, size, GSTIN), dependencies,</text><text x="800.0" y="313" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">price + 18% GST · catalogue from CSV</text><rect x="555" y="370" width="490" height="90" rx="10" fill="#fff5f5" stroke="#c81e1e" stroke-width="1.5"/><text x="800.0" y="396" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Smart KYC</text><text x="800.0" y="416" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">RapidOCR in memory · blur / skew / type checks</text><text x="800.0" y="433" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">name, GSTIN, Udyam, address-age cross-checks</text><rect x="715" y="480" width="330" height="60" rx="10" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="880.0" y="516.0" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Mock GSTIN / Udyam registries</text><rect x="555" y="570" width="490" height="90" rx="10" fill="#fff5f5" stroke="#c81e1e" stroke-width="1.5"/><text x="800.0" y="596" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Orders + tracker</text><text x="800.0" y="616" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">status machine, slots, per-item ETAs</text><text x="800.0" y="633" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">phone encrypted (Fernet)</text><rect x="555" y="740" width="490" height="90" rx="10" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="800.0" y="766" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Back-office API</text><text x="800.0" y="786" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">lead score (0–1) + HOT/WARM/COLD band</text><text x="800.0" y="803" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">suggested channel: FIELD · PARTNER · SELF_SERVE_LINK</text><rect x="555" y="848" width="490" height="36" rx="8" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/><text x="800.0" y="871" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Masking + log redaction on every response and log line (GSTIN, Udyam, ID, phone)</text><rect x="1260" y="120" width="300" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="1410.0" y="146" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">External LLM APIs</text><text x="1410.0" y="166" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Groq, Gemini</text><text x="1410.0" y="183" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">(skipped in rules-only mode)</text><rect x="1260" y="270" width="300" height="400" rx="12" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/><text x="1410.0" y="300" font-size="18" font-weight="bold" fill="#3730a3" text-anchor="middle">SQLite</text><text x="1410.0" y="328" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">advisor sessions, handoffs</text><text x="1410.0" y="348" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">quotes</text><text x="1410.0" y="368" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">consents (version, purposes)</text><text x="1410.0" y="388" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">KYC results: checks, verdict,</text><text x="1410.0" y="408" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">masked fields only (no images)</text><text x="1410.0" y="428" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">orders + events</text><text x="1410.0" y="448" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">phone encrypted at rest</text><text x="1410.0" y="468" font-size="13" font-weight="normal" fill="#222" text-anchor="middle"></text><text x="1410.0" y="488" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">retention: 180 days after</text><text x="1410.0" y="508" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">activation · 30 days if rejected</text><text x="1410.0" y="528" font-size="13" font-weight="normal" fill="#222" text-anchor="middle">withdraw consent = delete KYC data</text><rect x="1260" y="740" width="300" height="110" rx="10" fill="#f3f4f6" stroke="#666" stroke-width="1.5"/><text x="1410.0" y="766" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Case CSVs (read-only)</text><text x="1410.0" y="786" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">product catalogue · 5,000 leads</text><text x="1410.0" y="803" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">mock GSTIN + Udyam registries</text><path d="M340,160 L555,160" fill="none" stroke="#555" stroke-width="2"/><polygon points="555.0,160.0 543.0,154.0 543.0,166.0" fill="#555"/><rect x="375.8" y="121" width="144.4" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="448" y="133" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">business description,</text><rect x="375.8" y="137" width="144.4" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="448" y="149" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">EN/HI (text or voice)</text><path d="M1045,152 L1260,152" fill="none" stroke="#b45309" stroke-width="2"/><polygon points="1260.0,152.0 1248.0,146.0 1248.0,158.0" fill="#b45309"/><rect x="1067.0" y="112" width="170.0" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="1152" y="124" font-size="12" font-weight="normal" fill="#b45309" text-anchor="middle">business description only</text><rect x="1044.